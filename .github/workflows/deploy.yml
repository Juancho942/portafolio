name: Deploy Portafolio to Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Obtener el código
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Instalar dependencias
      run: npm install

    - name: Compilar el proyecto (Build)
      run: npm run build

    - name: Subir a Hostinger vía LFTP Nativo
      env:
        FTP_SERVER: ${{ secrets.FTP_SERVER }}
        FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
        FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      run: |
        sudo apt-get update && sudo apt-get install lftp -y
        lftp -c "set ftp:ssl-allow no; set ftp:passive-mode true; set net:timeout 30; open -p 21 -u '$FTP_USERNAME','$FTP_PASSWORD' '$FTP_SERVER'; mirror -R ./dist/ /public_html/ --parallel=5 --verbose;"
